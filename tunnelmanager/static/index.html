<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TunnelManager</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Cpath d='M7 21c4-9 14-9 18 0' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='7' cy='21' r='2.6' fill='%2322c55e'/%3E%3Ccircle cx='25' cy='21' r='2.6' fill='%2322c55e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script>
  // theme before first paint: saved choice, else the system's
  (function () {
    try {
      var t = localStorage.getItem("tm-theme");
      if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = t;
    } catch (e) { document.documentElement.dataset.theme = "dark"; }
  })();
</script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="auth" class="auth hidden">
  <form class="auth-card" id="auth-form">
    <div class="brand big"><span class="logo"></span><span>TunnelManager</span></div>
    <p class="muted" id="auth-sub">ورود به پنل مدیریت تانل‌ها</p>
    <label>نام کاربری<input name="username" autocomplete="username" required value="admin"></label>
    <label>رمز عبور<input name="password" type="password" autocomplete="current-password" required minlength="6"></label>
    <button class="btn primary wide" type="submit" id="auth-btn">ورود</button>
    <p class="error" id="auth-err"></p>
  </form>
</div>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand"><span class="logo"></span><span>TunnelManager</span><span class="ver" id="ver"></span></div>
    <div class="stats" id="stats"></div>
    <div class="actions">
      <span class="live" id="live" title="اتصال زنده به پنل"><i></i><span id="last-check">—</span></span>
      <button class="btn" id="btn-scan" title="پیدا کردن تانل‌هایی که از قبل روی سرورها فعال‌اند">جستجوی تانل‌ها</button>
      <button class="btn" id="btn-check" title="بررسی فوری همه مسیرها">بررسی</button>
      <button class="btn primary" id="btn-discover" title="ساخت تانل‌های ساخته‌نشده با بهترین پروتکل">تست و اتصال</button>
      <div class="menu">
        <button class="btn" id="btn-add">＋ افزودن</button>
        <div class="menu-pop" id="add-pop">
          <button data-add="kharej">سرور خارج</button>
          <button data-add="iran">سرور داخل</button>
          <button data-add="link">تانل جدید</button>
          <button data-add="provider">حساب DNS</button>
          <button data-add="domain">دامنه</button>
        </div>
      </div>
      <button class="btn icon" id="btn-settings" title="تنظیمات" aria-label="تنظیمات">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <button class="btn icon" id="btn-theme" title="روشن / تاریک" aria-label="تم">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
      </button>
      <button class="btn icon" id="btn-logout" title="خروج" aria-label="خروج">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="canvas" id="canvas">
      <div class="world" id="world" dir="ltr">
        <svg class="wires" id="wires"></svg>
        <div id="nodes"></div>
      </div>
      <div class="legend" id="legend">
        <span><i class="sw up"></i>وصل</span>
        <span><i class="sw degraded"></i>ناپایدار</span>
        <span><i class="sw down"></i>قطع</span>
        <span><i class="sw testing"></i>در حال تست</span>
        <span><i class="sw handover"></i>پورت‌ها منتقل‌شده</span>
        <span><i class="flow"></i>مسیر ترافیک</span>
      </div>
      <div class="tools" id="tools">
        <button class="tool" data-zoom="in" title="بزرگ‌نمایی">＋</button>
        <span class="zoom-val" id="zoom-val">100%</span>
        <button class="tool" data-zoom="out" title="کوچک‌نمایی">－</button>
        <span class="tool-sep"></span>
        <button class="tool" data-zoom="fit" title="نمایش همه">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
        <button class="tool" data-zoom="reset" title="چیدمان پیش‌فرض">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>
        </button>
        <label class="tool-check" title="تانل‌های رزرو سالم"><input type="checkbox" id="show-standby" checked> رزروها</label>
      </div>
      <div class="empty-hint hidden" id="empty-hint"></div>
    </section>

    <section class="lower">
      <div class="panel">
        <div class="panel-head">
          <h3>تانل‌ها</h3>
          <label class="tool-check"><input type="checkbox" id="show-pending"> نمایش ساخته‌نشده‌ها</label>
        </div>
        <div class="table-wrap"><table class="links" id="links-table"></table></div>
      </div>
      <div class="panel">
        <div class="panel-head">
          <h3>رویدادها</h3>
          <div class="seg" id="ev-filter">
            <button data-f="all" class="on">همه</button>
            <button data-f="error">خطا</button>
            <button data-f="warning">هشدار</button>
            <button data-f="success">موفق</button>
          </div>
        </div>
        <ol class="events" id="events"></ol>
      </div>
    </section>
  </main>

  <aside class="drawer" id="drawer"><div class="drawer-inner" id="drawer-body"></div></aside>
  <div class="scrim" id="scrim"></div>
  <div class="modal" id="modal"><form class="modal-card" id="modal-form"></form></div>
  <div class="tip" id="tip"></div>
  <div class="toasts" id="toasts"></div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
